spring.application.name=joyvault
spring.main.banner-mode=off
spring.jmx.enabled=false
spring.web.resources.add-mappings=false
spring.mvc.log-request-details=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.threads.max=16
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=32
server.tomcat.max-connections=32
server.tomcat.connection-timeout=10s
server.tomcat.keep-alive-timeout=5s
server.tomcat.max-keep-alive-requests=100
server.max-http-header-size=8KB
server.tomcat.max-swallow-size=0
server.tomcat.accesslog.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
logging.level.root=WARN
logging.level.com.joyvault=INFO
logging.file.name=${VAULT_LOG_FILE:java-native/logs/vault.log}
logging.logback.rollingpolicy.max-file-size=1MB
logging.logback.rollingpolicy.max-history=3
logging.logback.rollingpolicy.total-size-cap=3MB
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %level %logger{36} - %msg%n
