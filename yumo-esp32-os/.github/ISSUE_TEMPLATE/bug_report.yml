name: 问题反馈
description: 报告设备、构建或服务中的可复现问题
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: 版本或提交
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 硬件与环境
      description: 板卡型号、供电方式、相关外设/模式，或构建环境。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果及脱敏日志
      description: 不要包含密码、密钥或个人数据。
    validations:
      required: true
